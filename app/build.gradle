apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'

android {
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileSdk 37
    buildToolsVersion '37.0.0'
    defaultConfig {
        applicationId "atlow.chemi.mymada"
        minSdk 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Target changes require notification/service and edge-to-edge work in #24/#25.
        targetSdkVersion 33
        // Development version only; verify Play's highest versionCode before release (#11).
        versionCode 12828
        versionName '4.0.0-native-dev'
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable true
            minifyEnabled = false
            multiDexEnabled = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    productFlavors {
    }
    bundle {
        density {
            enableSplit true
        }
        abi {
            enableSplit true
        }
        language {
            enableSplit true
        }
    }
    namespace 'atlow.chemi.mymada'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-inappmessaging-display'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.play:feature-delivery:2.1.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

apply plugin: 'com.google.gms.google-services'
