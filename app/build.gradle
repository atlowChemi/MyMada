apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.firebase.crashlytics'

android {
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileSdk 36
    defaultConfig {
        applicationId "atlow.chemi.mymada"
        minSdkVersion 21
        // Target changes require notification/service and edge-to-edge work in #24/#25.
        targetSdkVersion 33
        // Development version only; verify Play's highest versionCode before release (#11).
        versionCode 12828
        versionName '4.0.0-native-dev'
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            firebaseCrashlytics {
                // Local unsigned verification must not upload mapping files.
                mappingFileUploadEnabled false
            }
            minifyEnabled true
            shrinkResources true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable true
            minifyEnabled = false
            multiDexEnabled = true
        }
    }
    compileOptions {
        sourceCompatibility '1.8'
        targetCompatibility '1.8'
    }
    productFlavors {
    }
    bundle {
        density {
            enableSplit true
        }
        abi {
            enableSplit true
        }
        language {
            enableSplit true
        }
    }
    namespace 'atlow.chemi.mymada'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    // Last Firebase/Ads release lines retaining API 21; see docs/android-toolchain.md.
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-inappmessaging-display'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.play:feature-delivery:2.1.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.wdullaer:materialdatetimepicker:4.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

apply plugin: 'com.google.gms.google-services'
