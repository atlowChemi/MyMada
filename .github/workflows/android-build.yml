name: Android build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # GitHub scopes PR caches to their merge ref; master cannot restore them.
          cache-read-only: false
      - name: Build debug app and instrumentation APKs
        run: >-
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          --no-daemon --build-cache '-Dorg.gradle.jvmargs=-Xmx3g'
      - name: Run JVM tests and Android Lint
        run: >-
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease
          --continue --no-daemon --build-cache '-Dorg.gradle.jvmargs=-Xmx3g'
      - name: Publish JUnit summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          report_paths: app/build/test-results/testDebugUnitTest/TEST-*.xml
          annotate_only: true
          require_tests: true
          fail_on_failure: true
          fail_on_parse_error: true
          detailed_summary: true
          failed_summary_logs: true
      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload debug APKs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
  emulator:
    name: Emulator API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            image: '24'
            target: google_apis
            page-size: ''
            font: '1.0'
          - api: 37
            image: '37.0'
            target: google_apis_ps16k
            page-size: '16384'
            font: '1.3'
    env:
      FONT_SCALE: ${{ matrix.font }}
      EXPECT_PAGE_SIZE: ${{ matrix.page-size }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false
      - name: Prepare APKs and KVM
        run: |
          # No NDK compilation or .NET is used by this Android smoke job.
          # Recent emulators can require >7GB userdata even with disk-size: 2G.
          sudo rm -rf "${ANDROID_HOME:?}/ndk" /usr/share/dotnet
          df -h "$HOME"
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --build-cache '-Dorg.gradle.jvmargs=-Xmx3g'
          sudo chmod 666 /dev/kvm
      - name: Run isolated emulator smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          system-image-api-level: ${{ matrix.image }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disk-size: 2G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          disable-spellchecker: true
          pre-emulator-launch-script: bash .github/scripts/emulator-smoke.sh isolate
          script: bash .github/scripts/emulator-smoke.sh
      - name: Publish emulator results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          report_paths: app/build/outputs/androidTest-results/connected/**/*.xml
          annotate_only: true
          require_tests: true
          fail_on_failure: true
          fail_on_parse_error: true
          detailed_summary: true
          failed_summary_logs: true
      - name: Upload emulator evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-api${{ matrix.api }}-${{ github.sha }}
          path: |
            emulator-evidence/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
