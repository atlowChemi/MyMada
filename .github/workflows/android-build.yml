name: Android build

on:
  workflow_dispatch:
    inputs:
      cache_only:
        description: Warm build/dependency caches without starting emulators (use master for a shared seed)
        type: boolean
        default: false
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.lanes.outputs.matrix }}
      has_lanes: ${{ steps.lanes.outputs.has_lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify retained instrumentation assignments
        run: |
          ruby .github/scripts/check-test-assignments.rb --self-test
          ruby .github/scripts/check-test-assignments.rb > test-assignments.txt
          ruby .github/scripts/select-android-lanes.rb --self-test
          ruby .github/scripts/render-lane-comment.rb --self-test
      - name: Select affected emulator lanes
        id: lanes
        env:
          CACHE_ONLY: ${{ inputs.cache_only }}
        run: ruby .github/scripts/select-android-lanes.rb
      - name: Publish lane selection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-selection-${{ github.sha }}
          path: lane-selection.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          accept-android-sdk-licenses: false
          packages: ''
      - name: Accept SDK licenses and install build packages
        run: bash .github/scripts/install-sdk.sh
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # One writer per run. Master seeds are readable by every PR; PR seeds
          # are readable by that PR's dependent emulator jobs and later reruns.
          cache-read-only: false
      - name: Build debug app and instrumentation APKs
        # Public fixtures go into the test APK, never the production application.
        # Downloads finish before any isolated emulator is started.
        run: |
          bash .github/scripts/download-test-fixtures.sh
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:resolveInstrumentationRunner \
            -Pandroid.experimental.androidTest.builtin_test_platform=true \
            --no-daemon --build-cache '-Dorg.gradle.jvmargs=-Xmx3g'
          # Seed the standalone fixture's plugin graph in the sole cache writer.
          ./gradlew -p app/src/androidTest/fixtures/call-source assembleDebug --no-daemon --build-cache '-Dorg.gradle.jvmargs=-Xmx2g'
      - name: Share verified fixtures with emulator jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-fixtures-${{ github.sha }}
          path: app/src/androidTest/assets/ci-fixtures/
          if-no-files-found: error
          retention-days: 2
      - name: Run JVM tests and Android Lint
        run: >-
          ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease
          --continue --no-daemon --build-cache '-Dorg.gradle.jvmargs=-Xmx3g'
      - name: Publish JUnit summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          report_paths: app/build/test-results/test*UnitTest/TEST-*.xml
          annotate_only: true
          require_tests: true
          fail_on_failure: true
          fail_on_parse_error: true
          detailed_summary: true
          failed_summary_logs: true
      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports-${{ github.sha }}
          path: |
            app/build/test-results/test*UnitTest/TEST-*.xml
            app/build/reports/tests/test*UnitTest/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            test-assignments.txt
          if-no-files-found: warn
          retention-days: 2
      - name: Upload debug APKs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 2
  emulator:
    name: Emulator API ${{ matrix.api }} / ${{ matrix.case }}
    needs: build
    if: ${{ needs.build.outputs.has_lanes == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Limit simultaneous SDK/Maven downloads on cold runners.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    env:
      FONT_SCALE: ${{ matrix.font }}
      EXPECT_PAGE_SIZE: ${{ matrix.page-size }}
      TEST_CLASSES: ${{ matrix.tests }}
      TEST_PACKAGES: ${{ matrix.packages }}
      TEST_EXCLUDE: ${{ matrix.exclude }}
      PERMISSION_ROUTE: ${{ matrix.permission-route }}
      CALL_SOURCE: ${{ matrix.call-source }}
      LISTENER_FIXTURE: ${{ matrix.listeners }}
      OVERLAY_FIXTURE: ${{ matrix.overlay }}
      EXTERNAL_AUDIO: ${{ matrix.external-audio }}
      TEST_LANGUAGE: ${{ matrix.language }}
      GRANT_NOTIFICATIONS: ${{ matrix.grant-notifications }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          accept-android-sdk-licenses: false
          packages: ''
      - name: Accept SDK licenses and install build packages
        run: bash .github/scripts/install-sdk.sh
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Restore the build job's seed; dozens of shard writes otherwise evict
          # shared entries. Gradle still fetches genuinely missing dependencies.
          cache-read-only: true
      - name: Restore verified fixtures from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-fixtures-${{ github.sha }}
          path: app/src/androidTest/assets/ci-fixtures/
      - name: Prepare emulator tooling and KVM
        run: |
          # No NDK compilation or .NET is used by this Android smoke job.
          # Recent emulators can require >7GB userdata even with disk-size: 2G.
          sudo rm -rf "${ANDROID_HOME:?}/ndk" /usr/share/dotnet
          df -h "$HOME"
          # emulator-runner prepends latest/bin, overriding setup-android's PATH.
          test -x "$ANDROID_HOME/cmdline-tools/16111833/bin/avdmanager"
          rm -rf "${ANDROID_HOME:?}/cmdline-tools/latest"
          ln -s 16111833 "$ANDROID_HOME/cmdline-tools/latest"
          bash .github/scripts/download-test-fixtures.sh
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --build-cache '-Dorg.gradle.jvmargs=-Xmx3g'
          if [[ "$CALL_SOURCE" == true ]]; then
            ./gradlew -p app/src/androidTest/fixtures/call-source assembleDebug --no-daemon --build-cache '-Dorg.gradle.jvmargs=-Xmx2g'
          fi
          sudo chmod 666 /dev/kvm
          if [ '${{ matrix.api }}' = '24' ]; then
            # API24 goldfish_pipe_dma_clear_lock crashes with the modern host renderer.
            mkdir -p "$HOME/.android"
            echo 'GLDMA = off' >> "$HOME/.android/advancedFeatures.ini"
          fi
      - name: Run isolated instrumentation suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          system-image-api-level: ${{ matrix.image }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          cores: ${{ matrix.api == 37 && 4 || 2 }}
          disk-size: 2G
          emulator-options: -no-window -accel on -gpu ${{ (matrix.api == 24 || matrix.target == 'default') && 'swangle' || 'swiftshader' }} -no-snapshot -noaudio -no-boot-anim -no-metrics -show-kernel
          disable-animations: true
          disable-spellchecker: true
          pre-emulator-launch-script: bash .github/scripts/emulator-smoke.sh isolate
          script: bash .github/scripts/emulator-smoke.sh
      - name: Publish emulator results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          report_paths: emulator-evidence/results/**/*.xml
          annotate_only: true
          require_tests: true
          fail_on_failure: true
          fail_on_parse_error: true
          detailed_summary: true
          failed_summary_logs: true
      - name: Upload emulator evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-api${{ matrix.api }}-${{ matrix.case }}-${{ github.sha }}
          path: |
            emulator-evidence/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 2
  required:
    name: Android CI
    if: ${{ always() }}
    needs: [build, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require build and every selected lane
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          EMULATOR_RESULT: ${{ needs.emulator.result }}
          HAS_LANES: ${{ needs.build.outputs.has_lanes }}
        run: |
          test "$BUILD_RESULT" = success
          if [[ "$HAS_LANES" == true ]]; then
            test "$EMULATOR_RESULT" = success
          else
            test "$HAS_LANES" = false
            test "$EMULATOR_RESULT" = skipped
          fi
