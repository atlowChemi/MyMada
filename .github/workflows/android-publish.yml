name: Android Play beta release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, validate a signed beta without rollout, or publish to existing beta testers
        type: choice
        options: [inspect, validate-beta, publish-beta]
        default: inspect
      version_code:
        description: Unused Play version code (must exceed current inventory)
        type: string
        default: '12828'
      version_name:
        description: Beta version name
        type: string
        default: '4.0.0-beta.5'

permissions:
  contents: read

concurrency:
  group: mymada-play-publishing
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Existing signing environment; its name does not select a Play track.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify preflight cleanup and failure handling
        run: node --test .github/scripts/play-*.test.mjs
      - name: Validate release inputs
        if: inputs.operation != 'inspect'
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
        run: >-
          node --input-type=module -e
          'import { validateRelease } from "./.github/scripts/play-beta.mjs";
          validateRelease(process.env.RELEASE_OPERATION, process.env.RELEASE_VERSION_CODE, process.env.RELEASE_VERSION_NAME);'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: inputs.operation != 'inspect'
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: inputs.operation != 'inspect'
        with:
          cmdline-tools-version: '16111833'
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install SDK build packages
        if: inputs.operation != 'inspect'
        run: bash .github/scripts/install-sdk.sh
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: inputs.operation != 'inspect'
        with:
          cache-read-only: true
      - name: Build and check the optimized release bundle
        if: inputs.operation != 'inspect'
        env:
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
        run: >-
          ./gradlew :app:bundleRelease :app:testReleaseUnitTest :app:lintRelease
          "-PreleaseVersionCode=$RELEASE_VERSION_CODE" "-PreleaseVersionName=$RELEASE_VERSION_NAME"
          --no-daemon --build-cache '-Dorg.gradle.jvmargs=-Xmx3g'
      - name: Sign with the replacement upload key
        if: inputs.operation != 'inspect'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp "$RUNNER_TEMP/mymada-upload-XXXXXX.p12")
          trap 'rm -f "$key"' EXIT
          test -n "$UPLOAD_KEYSTORE_BASE64"
          test -n "$UPLOAD_KEYSTORE_PASSWORD"
          test -n "$UPLOAD_KEY_ALIAS"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$key"
          bundle=app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore "$key" -storetype PKCS12 -storepass:env UPLOAD_KEYSTORE_PASSWORD \
            -keypass:env UPLOAD_KEYSTORE_PASSWORD "$bundle" "$UPLOAD_KEY_ALIAS"
          jarsigner -verify "$bundle"
          keytool -printcert -jarfile "$bundle"
          sha256sum "$bundle" > "$bundle.sha256"
          printf '%s\n' "$GITHUB_SHA" > app/build/outputs/bundle/release/source-commit.txt
      - name: Retain signed candidate and R8 mapping
        if: inputs.operation != 'inspect'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-beta-${{ inputs.version_code }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            app/build/outputs/bundle/release/
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7
      - name: Authenticate to Play without a service-account key
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Validate or publish beta
        if: inputs.operation != 'inspect'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_BUNDLE: app/build/outputs/bundle/release/app-release.aab
        run: node .github/scripts/play-beta.mjs
      - name: Inspect current Play releases
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node .github/scripts/play-preflight.mjs
