name: Build and deploy for dev

on:
    workflow_dispatch:
    push:
        branches:
            - 'dev'
            - 'master'
jobs:
    android-build:
        name: Android Dev Build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write
            pull-requests: write
        steps:
            -   name: Cancel previous runs
                uses: styfle/cancel-workflow-action@0.12.1
            -   name: Checkout repo
                uses: actions/checkout@v4
            -   name: Get yarn cache directory path
                id: yarn-cache-dir-path
                run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
            -   name: Restore node_modules from cache
                uses: actions/cache@v4
                id: yarn-cache
                with:
                    path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
                    key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
            -   name: Install yarn dependency
                run: yarn install --immutable --immutable-cache
            -   name: Validate typescript
                run: yarn tsc --noEmit
            -   name: Set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'
            -   name: Setup Android SDK
                uses: android-actions/setup-android@v3
            -   name: Cache Gradle
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                    restore-keys: |
                        ${{ runner.os }}-gradle-
            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v3
                with:
                    add-job-summary-as-pr-comment: on-failure
            -   name: Decode Keystore
                id: decode_keystore
                run: |
                    TMP_KEYSTORE_FILE_PATH="${RUNNER_TEMP}"/keystore
                    mkdir -p "${TMP_KEYSTORE_FILE_PATH}"
                    echo keystoreFile="${TMP_KEYSTORE_FILE_PATH}/cert.jks" >> "$GITHUB_OUTPUT"
                    echo ${{ secrets.ANDROID_SIGNING_KEY }} | base64 -di > "${TMP_KEYSTORE_FILE_PATH}"/cert.jks
            -   name: Generate APK & App Bundle
                env:
                    KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.keystoreFile }}
                    SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
                    SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                run: |
                    cd android
                    ./gradlew assembleRelease bundleRelease --scan
                    # --build-cache --configuration-cache
            -   name: Upload build reports
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: build-reports
                    path: build/reports/
            -   name: Upload as artifact
                uses: actions/upload-artifact@v4
                with:
                    name: Signed app files
                    path: |
                        android/app/build/outputs/apk/release/app-release.apk
                        android/app/build/outputs/bundle/release/app-release.aab
            ## Distribute app to Firebase App Distribution for testing / use google play internal track if you have a google play account
            -   name: upload artifact to Firebase App Distribution
                uses: wzieba/Firebase-Distribution-Github-Action@v1
                with:
                    appId: ${{ secrets.FIREBASE_APP_ID }}
                    serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
                    groups: testers
                    file: android/app/build/outputs/bundle/release/app-release.aab
            ## Distribute  App to google play alpha track
            # -   name: Upload App to Google Play
            #     uses: r0adkll/upload-google-play@v1
