name: Build and deploy for dev

on:
    workflow_dispatch:
    push:
        branches:
            - 'dev'
            - 'master'
jobs:
    android-build:
        name: Android Dev Build
        runs-on: ubuntu-latest
        steps:
            -   name: Cancel previous runs
                uses: styfle/cancel-workflow-action@0.12.1
            -   name: Checkout repo
                uses: actions/checkout@v4
            -   name: Get yarn cache directory path
                id: yarn-cache-dir-path
                run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
            -   name: Restore node_modules from cache
                uses: actions/cache@v4
                id: yarn-cache
                with:
                    path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
                    key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-yarn-
            -   name: Install yarn dependency
                run: yarn install --immutable --immutable-cache
            -   name: Set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'
            -   name: Setup Android SDK
                uses: android-actions/setup-android@v3
            -   name: Cache Gradle
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                    restore-keys: |
                        ${{ runner.os }}-gradle-
            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v3
            -   name: Decode Keystore
                id: decode_keystore
                run: |
                    TMP_KEYSTORE_FILE_PATH="${RUNNER_TEMP}"/keystore
                    mkdir -p "${TMP_KEYSTORE_FILE_PATH}"
                    echo keystoreFile="${TMP_KEYSTORE_FILE_PATH}/cert.jks" >> "$GITHUB_OUTPUT"
                    echo ${{ secrets.ANDROID_SIGNING_KEY }} | base64 -di > "${TMP_KEYSTORE_FILE_PATH}"/cert.jks
            -   name: Generate App APK
                env:
                    KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.keystoreFile }}
                    SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
                    SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_ALIAS }}
                    SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                run: |
                    cd android
                    ./gradlew assembleRelease
            -   name: Generate App Bundle
                env:
                    KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.keystoreFile }}
                    SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
                    SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_ALIAS }}
                    SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                run: |
                    cd android
                    ./gradlew bundleRelease
            # -   name: Copy APK & AAB to releases folder
            #     run: |
            #         mkdir -p releases
            #         cp android/app/build/outputs/apk/release/app-release-unsigned.apk releases/app-release.apk
            #         cp android/app/build/outputs/bundle/release/app-release.aab releases/app-release.aab
            # -   name: Sign APK
            #     id: sign_app
            #     uses: r0adkll/sign-android-release@v1
            #     with:
            #         releaseDirectory: releases
            #         signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
            #         alias: ${{ secrets.ANDROID_ALIAS }}
            #         keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
            #         keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
            -   name: Upload as artifact
                uses: actions/upload-artifact@v2
                with:
                    name: Signed app files
                    path: |
                        android/app/build/outputs/apk/release/app-release.apk
                        android/app/build/outputs/bundle/release/app-release.aab
                    # ${{steps.sign_app.outputs.signedReleaseFile0}}
                    # ${{steps.sign_app.outputs.signedReleaseFile1}}
